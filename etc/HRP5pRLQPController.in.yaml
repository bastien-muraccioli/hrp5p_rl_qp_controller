      LSR: 0.00350 # 350/200 * 0.002  
      LSY: 0.00200 # 200/200 * 0.002  
      LEP: 0.00400 # 400/200 * 0.002  
      LWRY: 0.00300 # 300/200 * 0.002  
      LWRR: 0.00300 # 300/200 * 0.002  
      LWRP: 0.00120 # 120/200 * 0.002

