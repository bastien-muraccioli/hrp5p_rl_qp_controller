---
# If true, the FSM transitions are managed by an external tool
Managed: false
# If true and the FSM is self-managed, transitions should be triggered
StepByStep: true
# Change idle behaviour, if true the state is kept until transition,
# otherwise the FSM holds the last state until transition
IdleKeepState: false
# Where to look for state libraries
StatesLibraries:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@"
# Where to look for state files
StatesFiles:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@/data"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@/data"
# If true, state factory will be more verbose
VerboseStateFactory: false
# Additional robots to load
robots:
  ground:
    module: env/ground

# Collision constraint
collisions:
- type: collision
  useMinimal: true

ObserverPipelines:
- name: MainPipeline
  observers:
    # Add an encoder observer to read joint velocities (Required for closed loop control)
    - type: Encoder
      config:
          velocity: encoderVelocities
    - type: BodySensor                    
      update: true                        
      gui: false                           
      config:                          
        bodySensor: FloatingBase
    # - type:
    # - type: Attitude
    # - type: KinematicInertial
    #   config:
    #     anchorFrame:
    #       maxAnchorFrameDiscontinuity: 0.05 # [m]

# Implement some additional text states
states: {}
# Transitions map
transitions:
- [HRP5pRLQPController_Initial, OK, HRP5pRLQPController_Initial, Strict]
# Initial state
init: HRP5pRLQPController_Initial

# RL policy configuration parameters
policy_path: ["1.onnx", "2.onnx"]  # Path to the RL policy file(s) 
default_policy_index: 1 # Index of the default policy to use
policies:
  # index 0 : policyName1
  - is_torque_control: true
    use_QP: false
    policy_step_size: 0.02 # Policy step size in seconds
    physics_step_size: 0.0025 # Physics step size in seconds
    pd_gains_ratio: 1.0

    # Action scaling factors for each joint, used to scale the policy output to the appropriate range for the robot's joints. 
    # Action scaling must respect the same order as the robot's joint order used in the RL framework.
    # Action scale must be set to 0 for joints that are not controlled by the policy, to avoid unintended movements.
    # Nb: q0 is used to define the joint order in mc_rtc.
    action_scale:  
      # Right Leg (lower × 0.05)  
      RCY: 0.01250 # 200/800  * 0.05  
      RCR: 0.03125 # 500/800  * 0.05  
      RCP: 0.03125 # 500/800  * 0.05  
      RKP: 0.07500 # 1200/800 * 0.05  
      RAP: 0.06250 # 250/200  * 0.05  ← upper_scale  
      RAR: 0.00150 # 200/200  * 0.002 ← upper_scale  
      
      # Left Leg (lower × 0.05)  
      LCY: 0.01250 # 200/800  * 0.05  
      LCR: 0.03125 # 500/800  * 0.05  
      LCP: 0.03125 # 500/800  * 0.05  
      LKP: 0.07500 # 1200/800 * 0.05  
      LAP: 0.06250 # 250/200  * 0.05  ← lower_scale  
      LAR: 0.00150 # 200/200  * 0.002 ← upper_scale  
      
      # Waist (lower × 0.05)  
      WP: 0.05625 # 900/800 * 0.05  
      WR: 0.05625 # 900/800 * 0.05  
      WY: 0.01563 # 250/800 * 0.05  
      
      # Head (upper × 0.002)  
      HY: 0.00045 # 45/200  * 0.002   
      HP: 0.00045 # 45/200  * 0.002 
      
      # Right Arm (upper × 0.002)  
      RSC: 0.00200 # 200/200 * 0.002  
      RSP: 0.00400 # 400/200 * 0.002  
      RSR: 0.00350 # 350/200 * 0.002  
      RSY: 0.00200 # 200/200 * 0.002  
      REP: 0.00400 # 400/200 * 0.002  
      RWRY: 0.00300 # 300/200 * 0.002  
      RWRR: 0.00300 # 300/200 * 0.002  
      RWRP: 0.00120 # 120/200 * 0.002

      # Right Hand (Not commended by the policy)  
      RHDY: 0.0  
      RIMP: 0.0  
      RIPIP: 0.0  
      RIDIP: 0.0  
      RMMP: 0.0  
      RMPIP: 0.0  
      RMDIP: 0.0  
      RTMP: 0.0  
      RTPIP: 0.0  
      RTDIP: 0.0   
      
      # Left Arm (upper × 0.002)  
      LSC: 0.00200 # 200/200 * 0.002  
