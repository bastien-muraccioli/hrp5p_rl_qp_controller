---
Managed: false
StepByStep: true
IdleKeepState: false

StatesLibraries:
  - "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@"
  - "@MC_STATES_RUNTIME_INSTALL_PREFIX@"

StatesFiles:
  - "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@/data"
  - "@MC_STATES_RUNTIME_INSTALL_PREFIX@/data"

VerboseStateFactory: false

robots:
  ground:
    module: env/ground

robot:
  base_body: pelvis
  observation_source: realRobot

collisions:
  - type: collision
    useMinimal: true

ObserverPipelines:
  name: "ObserverPipeline"
  gui: true
  log: true
  observers:
    - type: Encoder
      velocity: encoderFiniteDifferences
      # velocity: encoderVelocities
                          # - type: Tilt
                          #   required: true
                          #   update: true
                          #   filterGains:
                          #     initAlpha: 4
                          #     initBeta: 4
                          #     initGamma: 1
                          #     finalAlpha: 4
                          #     finalBeta: 4
                          #     finalGamma: 1
                          #   contacts:
                          #     contactsDetection: Surfaces
                          #     surfacesForContactDetection: [RightFootCenter, LeftFootCenter]
    - type: BodySensor
      update: true
      bodySensor: FloatingBase
      updateAcc: true
    - type: ExternalForcesObserver
      is_active: false
      estimation_method: ForceSensorBased    # MomentumObserver, ForceSensorBased
      torque_source_type: MotorTorqueMeasurement
      residual_gain: 50.0

constraints:
  - type: contact
    contactType: acceleration
  - type: compoundJoint

collisions:
- type: collision
  useMinimal: true

states: {}

transitions:
  - [HRP5pRLQPController_Initial, OK, HRP5pRLQPController_Initial, Strict]
  - [HRP5pRLQPController_Initial, RL, HRP5pRLQPController_RL, Strict]
  - [HRP5pRLQPController_RL, OK, HRP5pRLQPController_Initial, Strict]

init: HRP5pRLQPController_Initial

policies_root: "@CMAKE_CURRENT_SOURCE_DIR@/policies"

default_policy: gazelle2

is_initiale_posture_rl: true

