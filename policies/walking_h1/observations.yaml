training_convention: mjlab

observations:
  - type: base_ang_vel
    parameters:
      history: 1 

  - type: base_orientation
    parameters:
      history: 1
      index: [0,1] # roll, pitch

  - type: joint_pos_rel
    parameters:
      history: 1
      joints: legs

  - type: joint_vel_rel
    parameters:
      history: 1
      joints: legs

  - type: last_action
    parameters:
      index: [0, 1, 3, 4, 7, 8, 11, 12, 15, 16]
      history: 1

  - type: phase
    parameters:
      history: 1

  - type: generated_commands
    parameters:
      history: 1
      size: 3
