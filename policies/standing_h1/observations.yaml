training_convention: mjlab

observations:
  - type: base_ang_vel
    parameters:
      history: 1 

  - type: base_orientation
    parameters:
      history: 1
      index: [0,1] # roll, pitch

  - type: joint_pos_rel
    parameters:
      history: 1
      joints: legs

  - type: joint_vel_rel
    parameters:
      history: 1
      joints: legs

  - type: last_action
    parameters:
      joints: legs
      history: 1