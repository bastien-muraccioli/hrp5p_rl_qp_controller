training_convention: mjlab

observations:
  - type: base_ang_vel
    parameters:
      history: 3
      scale: 0.25

  - type: base_orientation
    parameters:
      history: 3
      index: [0,1] # roll, pitch

  - type: joint_pos_rel
    parameters:
      history: 3
      joints: legs

  - type: joint_vel_rel
    parameters:
      history: 3
      joints: legs
      scale: 0.05

  - type: last_action
    parameters:
      history: 3

  - type: phase
    parameters:
      history: 1
      cos_first: true

  - type: generated_commands
    parameters:
      history: 1
      size: 3
