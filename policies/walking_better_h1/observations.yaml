training_convention: mjlab

observations:
  - type: base_ang_vel
    history: 3
    parameters:
      scale: 0.25

  - type: base_orientation
    history: 3
    parameters:
      index: [0,1] # roll, pitch

  - type: joint_pos_rel
    history: 3
    parameters:
      joints: legs

  - type: joint_vel_rel
    history: 3
    parameters:
      joints: legs
      scale: 0.05

  - type: last_action
    history: 3

  - type: phase
    history: 1

  - type: generated_commands
    history: 1
    parameters:
      size: 3
